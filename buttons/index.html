<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Styling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&family=Inter:wght@500&family=Libre+Caslon+Text:ital,wght@0,400;1,400&family=Oswald:wght@600&family=Luckiest+Guy&family=Pinyon+Script&family=Cormorant+Garamond:wght@600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/buttons.css">
</head>

<body>

    <h1>Button Styling &middot; Grace Wang</h1>

    <div class="grid">

        <div class="box">
            <a href="http://www.apple.com/" class="apple-button">Apple <span class="chevron">&rsaquo;</span></a>
        </div>

        <div class="box">
            <a href="http://www.newyorker.com/" class="newyorker-button">
                <span class="the">The</span>
                New Yorker
            </a>
        </div>

        <div class="box box-dark">
            <a href="http://www.harley-davidson.com/" class="harley-button">Harley-Davidson</a>
        </div>

        <div class="box">
            <a href="http://www.explodingkittens.com/" class="kittens-button">Exploding<br>Kittens!</a>
        </div>

        <div class="box">
            <a href="http://www.bissingers.com/" class="bissingers-button">
                <span class="script">Bissinger's</span>
                <span class="small">Chocolatier</span>
            </a>
        </div>

    </div>

</body>

</html>
